# Builds wheels for 9 platforms and the sdist, tests the wheels, and
# publishes them to PyPI after a manual approval on the "release"
# environment.
#
# Trigger: push a tag like v0.1.0, or run manually. Manual runs stop after
# building unless "publish" is checked.
#
# Before the first release:
#   - Create the "release" environment (Settings > Environments) with
#     required reviewers, so the publish job waits for approval.
#   - Publishing uses PyPI trusted publishing (OIDC), not a token: on
#     pypi.org, add a (pending) trusted publisher for the project
#     "timecode-tools": this repository, workflow file release.yml and
#     environment "release".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (after approval)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, host: macos-14, target: aarch64-apple-darwin }
          - { name: macOS x64, host: macos-14, target: x86_64-apple-darwin }
          - { name: Windows x64, host: windows-latest, target: x64 }
          - { name: Windows arm64, host: windows-latest, target: aarch64-pc-windows-msvc }
          # manylinux2014 (glibc 2.17), so wheels install on old distros
          - { name: Linux x64 glibc, host: ubuntu-latest, target: x86_64, manylinux: '2014' }
          - { name: Linux arm64 glibc, host: ubuntu-latest, target: aarch64, manylinux: '2014' }
          - { name: Linux armv7 glibc, host: ubuntu-latest, target: armv7, manylinux: '2014' }
          - { name: Linux x64 musl, host: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: Linux arm64 musl, host: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, host: macos-14, python: '3.13' }
          - { name: macOS x64, host: macos-15-intel, python: '3.13' }
          - { name: Windows x64, host: windows-latest, python: '3.13' }
          - { name: Windows arm64, host: windows-11-arm, python: '3.13' }
          - { name: Linux x64 glibc (3.10), host: ubuntu-latest, python: '3.10' }
          - { name: Linux x64 glibc (3.14), host: ubuntu-latest, python: '3.14' }
          - { name: Linux arm64 glibc, host: ubuntu-24.04-arm, python: '3.13' }
          - { name: Linux x64 musl, host: ubuntu-latest, container: 'python:3.13-alpine' }
          # armv7 and arm64 musl are built but not run on hardware here.
    container: ${{ matrix.container }}
    steps:
      # Keep files byte for byte (goldens/ is checked against SHA256SUMS).
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # pip picks the wheel for this platform; --no-index keeps it from
      # building the package from source instead.
      - run: python -m pip install --no-index --find-links dist timecode-tools
      - run: python -m pip install pytest numpy
      - run: python -m pytest -v

  check:
    name: Check
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel-*,sdist}'
          path: dist
          merge-multiple: true
      - name: Check that all 9 wheels and the sdist are present
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 9
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
      - name: Check that the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: python3 -m pip install twine && python3 -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release # waits for a manual approval
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC) and attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      # No token: PyPI authenticates the workflow's OIDC identity, and
      # attestations are added automatically.
      - uses: pypa/gh-action-pypi-publish@release/v1
