name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release tag of https://github.com/ShowBuildLaboratories/timecode-tools-rs
  # matching the crate version in Cargo.toml. Its goldens/ must equal ours.
  CORE_REF: v0.1.0

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The wheel is abi3 (one build for 3.10 and later): test the oldest
        # and the newest.
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: timecode-tools-python
    steps:
      # Keep files byte for byte (goldens/ is compared with the core's copy).
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
        working-directory: .
      - uses: actions/checkout@v4
        with:
          path: timecode-tools-python
      - uses: actions/checkout@v4
        with:
          repository: ShowBuildLaboratories/timecode-tools-rs
          ref: ${{ env.CORE_REF }}
          path: timecode-tools-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: timecode-tools-python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Builds the package from source with maturin (the build backend).
      - run: python -m pip install . pytest numpy
      - run: python -m pytest -v
      - run: python scripts/goldens.py check --require-core

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python -m pip install ruff mypy
      - run: ruff check python tests scripts examples
      - run: ruff format --check python tests scripts examples
      - run: mypy -p timecode_tools
        env:
          MYPYPATH: python
      - name: Build the sdist and check the package metadata
        run: |
          python -m pip install maturin twine
          maturin sdist --out dist
          twine check --strict dist/*
